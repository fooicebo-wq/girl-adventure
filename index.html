const TAU = Math.PI * 2;
function circle(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function sky(ctx, c1, c2, c3) {                            // 天空漸層（往上下多畫一截，世界上提時不會露白）
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, c1); if (c3) g.addColorStop(0.55, c3); g.addColorStop(1, c2);
    ctx.fillStyle = g; ctx.fillRect(0, -90, VIEW_W, H + 180);
}
function repeat(off, spacing, fn) {                        // 沿水平方向重複擺放（i 可為負，拿來當亂數種子）
    const first = Math.floor(off / spacing) - 1;
    for (let i = first; i * spacing - off < VIEW_W + spacing; i++) fn(i * spacing - off, i);
}
function hills(ctx, off, base, amp, f1, f2, color) {
    ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, H + 90);
    for (let x = 0; x <= VIEW_W + 16; x += 16) { const wx = x + off; ctx.lineTo(x, base - (Math.sin(wx * f1) * 0.6 + Math.sin(wx * f2 + 1.7) * 0.4) * amp); }
    ctx.lineTo(VIEW_W, H + 90); ctx.closePath(); ctx.fill();
}
function cloud(ctx, x, y, s, color) {
    ctx.fillStyle = color; circle(ctx, x, y, 12 * s); circle(ctx, x + 15 * s, y - 8 * s, 17 * s); circle(ctx, x + 32 * s, y - 1 * s, 13 * s);
    ctx.fillRect(x, y - 1 * s, 32 * s, 12 * s);
}
function clouds(ctx, off, y, spacing, sc, color, seed) {
    repeat(off, spacing, (x, i) => cloud(ctx, x, y + hash01(i * 7.7 + seed) * 60, sc * (0.7 + hash01(i * 3.3 + seed) * 0.8), color));
}
function stars(ctx, off, n, seed, t, maxY) {
    for (let i = 0; i < n; i++) {
        let x = (hash01(i + seed) * 1200 - off * 0.04) % 1200; if (x < 0) x += 1200; if (x > VIEW_W) continue;
        ctx.globalAlpha = 0.45 + 0.5 * Math.sin(t * 0.05 + i * 1.3); ctx.fillStyle = '#fff';
        const s = 1 + hash01(i * 5.1 + seed) * 1.6; ctx.fillRect(x, hash01(i * 5.3 + seed) * maxY, s, s);
    }
    ctx.globalAlpha = 1;
}
// 飄動粒子：花瓣、糖粒、火星、雪、雨、灰燼…位置由時間直接算出，不用逐顆更新
function ambient(ctx, o, t, cam) {
    const WW = VIEW_W + 200, HH = H + 100;
    for (let i = 0; i < o.n; i++) {
        const h1 = hash01(i + o.seed), h2 = hash01(i * 3.7 + o.seed), h3 = hash01(i * 7.9 + o.seed), k = 0.6 + h3 * 0.8;
        let x = (h1 * WW + t * o.vx * k - cam * (o.par === undefined ? 0.3 : o.par)) % WW; if (x < 0) x += WW; x -= 100;
        let y = (h2 * HH + t * o.vy * k) % HH; if (y < 0) y += HH; y -= 60;
        const sz = o.size * (0.6 + h3 * 0.8);
        ctx.fillStyle = Array.isArray(o.color) ? o.color[(h3 * o.color.length) | 0] : o.color; ctx.strokeStyle = ctx.fillStyle;
        if (o.shape === 'line') { ctx.lineWidth = sz; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + o.vx * 3, y + o.vy * 3); ctx.stroke(); }
        else if (o.shape === 'petal') { ctx.save(); ctx.translate(x + Math.sin(t * 0.03 + i) * 12, y); ctx.rotate(t * 0.04 + i); ctx.beginPath(); ctx.ellipse(0, 0, sz * 1.4, sz * 0.7, 0, 0, TAU); ctx.fill(); ctx.restore(); }
        else if (o.shape === 'ember') { ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 0.2 + i * 2); circle(ctx, x + Math.sin(t * 0.04 + i) * 8, y, sz); ctx.globalAlpha = 1; }
        else circle(ctx, x + Math.sin(t * 0.025 + i * 1.7) * (o.sway || 0), y, sz);
    }
}

function buildingRow(ctx, off, spacing, base, minH, maxH, wBase, color, win, seed, t) {
    repeat(off, spacing, (x, i) => {
        const h = minH + hash01(i * 5.3 + seed) * (maxH - minH), w = wBase + hash01(i * 2.1 + seed) * 30;
        ctx.fillStyle = color; ctx.fillRect(x, base - h, w, h + 90);

            ctx.fillStyle = win; ctx.beginPath();
            for (let wy = base - h + 12; wy < base - 8; wy += 16) for (let wx = x + 6; wx < x + w - 8; wx += 12) {
                if (hash01(wx * 0.37 + wy * 1.13 + i + seed) > 0.42) ctx.rect(wx, wy, 6, 8);
            }
            ctx.fill();
        }
    });
}

    }
};

// 依主題換皮的地面／平台：頂部亮邊＋底部紋路（紋路合成一條路徑、只填一次）
function drawPlatform(ctx, p, rx, ph, th, camX) {
    const x0 = Math.max(rx, -20), x1 = Math.min(rx + p.width, VIEW_W + 20);
    ctx.fillStyle = th.body; ctx.fillRect(rx, p.y, p.width, ph);
    ctx.fillStyle = th.detail; ctx.globalAlpha = 0.22; ctx.beginPath();
    if (th.pat === 'brick') { for (let row = 0, y = p.y + 14; y < p.y + ph - 2; row++, y += 16) { ctx.rect(x0, y, x1 - x0, 1.5); for (let x = Math.floor((x0 - rx) / 32) * 32 + (row % 2) * 16; x < x1 - rx; x += 32) if (x + rx > x0) ctx.rect(rx + x, y - 16, 1.5, 16); } }
    else if (th.pat === 'dots') { for (let y = p.y + 20; y < p.y + ph - 4; y += 18) for (let x = Math.floor((x0 - rx) / 26) * 26 + ((y - p.y) % 36 ? 13 : 0); x < x1 - rx; x += 26) if (x + rx > x0) { ctx.moveTo(rx + x + 2.4, y); ctx.arc(rx + x, y, 2.4, 0, TAU); } }
    else if (th.pat === 'stripe') { for (let x = Math.floor((x0 - rx) / 24) * 24; x < x1 - rx; x += 24) if (x + rx > x0) { ctx.moveTo(rx + x, p.y + 8); ctx.lineTo(rx + x + 12, p.y + 8); ctx.lineTo(rx + x - 8, p.y + Math.min(ph, 60)); ctx.lineTo(rx + x - 20, p.y + Math.min(ph, 60)); ctx.closePath(); } }
    else { for (let y = p.y + 12; y < p.y + ph - 3; y += 14) ctx.rect(x0, y, x1 - x0, 1.2); }
    ctx.fill(); ctx.globalAlpha = 1;
    ctx.fillStyle = th.top; ctx.fillRect(rx, p.y, p.width, 8);
    ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(rx, p.y, p.width, 2);
    if (th.tufts) { ctx.fillStyle = th.top; ctx.beginPath(); for (let x = Math.floor((x0 - rx) / 22) * 22; x < x1 - rx; x += 22) if (x + rx > x0) { ctx.moveTo(rx + x, p.y + 1); ctx.lineTo(rx + x + 4, p.y - 6 - ((x / 22) % 3) * 2); ctx.lineTo(rx + x + 8, p.y + 1); } ctx.fill(); }
    ctx.strokeStyle = th.edge; ctx.lineWidth = 2; ctx.strokeRect(rx, p.y, p.width, ph);
}

function buildLevel(n) {
    const T = LEVELS[n], isBoss = !!T.boss, length = isBoss ? 1400 : 2000, rnd = mulberry32(n * 7919 + 13);
    const platforms = [{ x: -30, y: 0, width: 30, height: 450 }, { x: length, y: 0, width: 40, height: 450 }];
    const enemies = [], pickups = [], segs = [];
    if (isBoss) {
        platforms.push({ x: 0, y: 380, width: length, height: 70 });
        segs.push({ l: 0, r: length });
        platforms.push({ x: 230, y: 290, width: 130, height: 20 }, { x: 630, y: 272, width: 140, height: 20 }, { x: 1030, y: 290, width: 130, height: 20 });
        pickups.push(new Pickup(690, 246, 4, true));
        enemies.push(new Boss(T.boss, 900, 380 - BOSS_DEFS[T.boss].h, 420, length - 60));
    } else {
        const gap = 110, g = T.gaps, segLen = Math.floor((length - g * gap) / (g + 1));
        for (let i = 0; i <= g; i++) {                        // 地面剛好鋪滿整關（原版最後一段會超出邊界）
            const x = i * (segLen + gap), w = i === g ? length - x : segLen;
            platforms.push({ x, y: 380, width: w, height: 70 }); segs.push({ l: x, r: x + w });
        }
        const tunnels = [], wide = segs.filter(s => s.r - s.l >= 260), cand = wide.length ? wide : segs;
        for (let s = 0; s < T.slides; s++) {                  // 滑行隧道：要按「滑」才鑽得過
            const sg = cand[(s * 2 + 1) % cand.length], tw = Math.min(200, sg.r - sg.l - 60), x = sg.l + (sg.r - sg.l - tw) / 2;
            if (x + tw > length - 240) continue;
            const t = { x, y: 330, width: tw, height: 25 }; platforms.push(t); tunnels.push(t);
        }
        const hs = [300, 280, 296, 272];                      // 空中平台：高度都跳得上去（原版有兩個高到跳不上）
        for (let i = 0; i < 4; i++) {
            const x = 320 + i * 360;
            if (x + 130 > length - 200 || tunnels.some(t => x < t.x + t.width + 40 && x + 130 > t.x - 40)) continue;
            platforms.push({ x, y: hs[i], width: 130, height: 20 });
            if (i % 2 === 1) pickups.push(new Pickup(x + 54, hs[i] - 26, 4, true));
        }
        const placed = [];
        const place = (kind) => {
            const d = ENEMY_DEFS[kind];
            for (let a = 0; a < 60; a++) {
                let x, sg = null;
                if (d.fly) x = 520 + rnd() * (length - 520 - 340);
                else { sg = segs[Math.floor(rnd() * segs.length)]; const lo = Math.max(sg.l + 20, 340), hi = Math.min(sg.r - 20 - d.w, length - 330); if (hi <= lo) continue; x = lo + rnd() * (hi - lo); }
                if (placed.some(px => Math.abs(px - x) < 150)) continue;
                placed.push(x); return { x, sg };
            }
            return null;
        };
        for (const kind of T.foes) {                          // 敵人只站在地面上（原版會浮在深谷上方）
            const d = ENEMY_DEFS[kind], pos = place(kind); if (!pos) continue;
            const y = d.fly ? 130 + rnd() * 110 : 380 - d.h, sg = pos.sg;
            const o = { pal: kind === 'SHOOTER' ? T.pal.b : T.pal.a, skin: kind === 'SHOOTER' ? (T.shooterSkin || 'a') : (rnd() < 0.35 ? 'b' : 'a') };
            if (sg) { o.seg = [sg.l, sg.r]; o.pl = Math.max(sg.l + 6, pos.x - 140); o.pr = Math.min(sg.r - 6, pos.x + 140 + d.w); }
            else { o.pl = Math.max(60, pos.x - 150); o.pr = Math.min(length - 60, pos.x + 150 + d.w); }
            enemies.push(new Enemy(kind, pos.x, y, o));
        }
    }
    return { id: n, name: T.name, width: length, theme: T, isBossStage: isBoss, reward: T.reward, goal: { x: length - 120, y: 270, width: 44, height: 110 }, platforms, enemies, pickups, segs };
}

}

class Game {
    constructor() {
        const $ = (id) => document.getElementById(id);
        this.canvas = $('gameCanvas'); this.ctx = this.canvas.getContext('2d');
        this.input = new InputHandler(); this.fx = new FX();
        this.shootBtn = $('btn-shoot'); this.micBtn = $('btn-mic'); this.muteBtn = $('btn-mute'); this.toastEl = $('voice-toast'); this.touchUi = $('touch-ui');
        this.scale = 1; this.acc = 0; this.lastTs = undefined; this.worldShift = 0;
        this.state = 'splash'; this.t = 0; this.singT = 0; this.stage = 1; this.maxStage = 10;
        this.player = new Player(80, 200);
        this.shake = 0; this.flash = 0; this.banner = null; this.clearAnim = 0; this.deadAnim = 0; this.newWeapon = null;
        this.kills = 0; this.combo = 0; this.comboT = 0; this.superCool = 0; this.superKills = 0; this.swarmT = 0; this.boss = null;
        this.layout(); this.loadStage(1); this.bindEvents(); this.refreshMenu(); this.updateMuteBtn();
        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);
    }

    // ---------- 版面：直立＝畫面貼上緣、按鈕在下；橫放＝鋪滿螢幕 ----------
    layout() {
        const vw = window.innerWidth, vh = window.innerHeight, portrait = vh > vw * 1.1;
        document.body.classList.toggle('portrait', portrait);
        let cw;
        if (portrait) { VIEW_W = clamp(Math.round(vw * H / Math.max(220, vh - 250)), 440, 800); cw = vw; }
        else { VIEW_W = clamp(Math.round(H * vw / vh), 640, 960); cw = Math.min(vw, vh * VIEW_W / H); }
        this.worldShift = portrait ? 0 : 50;
        const ch = cw * H / VIEW_W;
        this.canvas.style.width = cw + 'px'; this.canvas.style.height = ch + 'px';
        this.scale = cw * Math.min(window.devicePixelRatio || 1, 2) / VIEW_W;
        this.canvas.width = Math.round(VIEW_W * this.scale); this.canvas.height = Math.round(H * this.scale);
        document.documentElement.style.setProperty('--canvas-bottom', ch + 'px');
    }

    // ---------- 畫面切換 ----------
    setScreen(name) { for (const id of ['splash', 'title', 'pause', 'win']) document.getElementById('screen-' + id).classList.toggle('hidden', id !== name); }
    showTouch(on) { this.touchUi.classList.toggle('hidden', !on); }
    refreshMenu() {
        const s = Store.get('save', null), btn = document.getElementById('btn-continue');
        if (s && s.stage > 1) { btn.textContent = `⏩ 繼續遊戲（第 ${s.stage} 關）`; btn.classList.remove('hidden'); } else btn.classList.add('hidden');
    }
    leaveSplash() {
        if (this.state !== 'splash') return;
        audio.unlock(); audio.playMusic('title');
        this.state = 'title'; this.setScreen('title'); this.singT = 0;
        setTimeout(() => { if (this.state === 'title') sing(); }, 900);
    }
    goHome() {
        this.state = 'title'; this.setScreen('title'); this.showTouch(false); this.hideToast(); voice.stop();
        try { speechSynthesis.cancel(); } catch (e) {}
        audio.resume(); audio.playMusic('title'); this.refreshMenu(); this.singT = 0;
    }
    newGame() {
        this.player.unlockedWeapons = ['NORMAL']; this.player.currentWeapon = 'NORMAL'; this.kills = 0;
        try { speechSynthesis.cancel(); } catch (e) {}
        this.beginStage(1);
    }
    continueGame() {
        const s = Store.get('save', null); if (!s) return this.newGame();
        const ok = [...new Set((s.weapons || []).filter(w => WEAPON_TYPES[w]))];
        this.player.unlockedWeapons = ok.length ? ok : ['NORMAL']; this.player.currentWeapon = WEAPON_TYPES[s.cur] && ok.includes(s.cur) ? s.cur : this.player.unlockedWeapons[this.player.unlockedWeapons.length - 1];
        try { speechSynthesis.cancel(); } catch (e) {}
        this.beginStage(clamp(s.stage | 0, 1, this.maxStage));
    }
    saveProgress(stage) { Store.set('save', { stage, weapons: this.player.unlockedWeapons, cur: this.player.currentWeapon }); }
    loadStage(n) {
        this.stage = n; this.level = buildLevel(n); this.player.reset(80, 200);
        this.bullets = []; this.ebullets = []; this.pickups = this.level.pickups; this.fx = new FX();
        this.cameraX = 0; this.clearAnim = 0; this.deadAnim = 0; this.newWeapon = null; this.boss = this.level.enemies.find(e => e.isBoss) || null;
        this.combo = 0; this.superKills = 0; this.swarmT = 0; this.superCool = 0; this.shake = 0; this.flash = 0;
    }
    beginStage(n) {
        this.loadStage(n); this.state = 'playing'; this.setScreen(null); this.showTouch(true); this.hideToast();
        audio.unlock(); audio.resume(); audio.playMusic(this.level.theme.track);
        this.banner = { text: `STAGE ${n}`, sub: this.level.name + '\n' + this.level.theme.tip, frames: 170, max: 170 };
        this.saveProgress(n); speak(`第${n}關，${this.level.name.replace(/[【】]/g, '')}`);
    }
    nextStage() {
        if (this.state !== 'playing') return;
        this.player.superTimer = 0;
        if (this.stage < this.maxStage) this.beginStage(this.stage + 1); else this.win();
    }
    pause() {
        if (this.state !== 'playing') return;
        this.state = 'paused'; this.setScreen('pause'); audio.suspend(); voice.stop(); this.hideToast(); audio.sfx('pause');
        try { speechSynthesis.cancel(); } catch (e) {}
    }
    resumeGame() { if (this.state !== 'paused') return; this.state = 'playing'; this.setScreen(null); audio.resume(); }
    toggleMute() { audio.setMuted(!audio.muted); this.updateMuteBtn(); if (audio.muted) { try { speechSynthesis.cancel(); } catch (e) {} } }
    updateMuteBtn() { this.muteBtn.textContent = audio.muted ? '🔇' : '🔊'; }
    win() {
        this.state = 'win'; this.setScreen('win'); this.showTouch(false); this.hideToast(); audio.stopMusic(); audio.playMusic('win');
        this.player.superTimer = 0; Store.set('save', null);
        speak('恭喜全破！爸爸得救了！爸爸最帥了！最愛爸爸！');
    }

    bindEvents() {
        const tap = (id, fn) => this.input.bindTap(id, fn);
        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            audio.unlock();
            if (this.state === 'splash') { this.leaveSplash(); return; }
            if (this.state === 'title' && (e.code === 'Enter' || e.code === 'Space')) { this.newGame(); return; }
            if (e.code === 'KeyP' || e.code === 'Escape') { if (this.state === 'paused') this.resumeGame(); else this.pause(); return; }
            if (e.code === 'KeyM') { this.toggleMute(); return; }
            if (this.state !== 'playing') return;
            if (e.code === 'KeyR') this.beginStage(this.stage);
            else if (e.code === 'KeyN') this.nextStage();
            else if (e.code === 'KeyV') this.onMicTap();
            else if (e.code === 'KeyB') this.activateSuper();
        });
        document.getElementById('screen-splash').addEventListener('pointerdown', (e) => { e.preventDefault(); this.leaveSplash(); });
        tap('btn-start', () => this.newGame());
        tap('btn-continue', () => this.continueGame());
        tap('btn-resume', () => this.resumeGame());
        tap('btn-restart', () => this.beginStage(this.stage));
        tap('btn-home', () => this.goHome());
        tap('btn-again', () => this.newGame());
        tap('btn-home2', () => this.goHome());
        tap('btn-weapon', () => { if (this.state === 'playing') this.player.cycleWeapon(); });
        tap('btn-next', () => this.nextStage());
        tap('btn-reset', () => { if (this.state === 'playing') this.beginStage(this.stage); });
        tap('btn-pause', () => this.pause());
        tap('btn-mute', () => this.toggleMute());
        tap('btn-mic', () => this.onMicTap());
        window.addEventListener('resize', () => this.layout());
        window.addEventListener('orientationchange', () => setTimeout(() => this.layout(), 250));
        if (window.visualViewport) window.visualViewport.addEventListener('resize', () => this.layout());
        document.addEventListener('contextmenu', (e) => e.preventDefault());
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) { if (this.state === 'playing') this.pause(); audio.suspend(); voice.stop(); }
            else if (this.state !== 'paused') audio.resume();
        });
    }

    // ---------- 語音：說「爸爸好帥」→ 超級Q妹 ----------
    toast(text, ms = 1800) {
        this.toastEl.textContent = text; this.toastEl.classList.remove('hidden');
        clearTimeout(this.toastT); if (ms > 0) this.toastT = setTimeout(() => this.toastEl.classList.add('hidden'), ms);
    }
    hideToast() { clearTimeout(this.toastT); this.toastEl.classList.add('hidden'); }
    onMicTap() {
        if (this.state !== 'playing') return;
        const p = this.player;
        if (p.superTimer > 0) { this.toast('超級Q妹模式中！衝啊！', 1200); return; }
        if (this.superCool > 0) { this.toast(`力量恢復中… ${Math.ceil(this.superCool / 60)} 秒`, 1200); return; }
        if (voice.listening) { voice.stop(); return; }
        audio.unlock();
        let handled = false;
        const fallback = (msg) => { handled = true; this.micBtn.classList.remove('listening'); this.toast(msg, 1800); this.activateSuper(); };
        const ok = voice.supported && voice.listen({
            onResult: () => { handled = true; this.micBtn.classList.remove('listening'); this.hideToast(); this.activateSuper(); },
            onEnd: () => { this.micBtn.classList.remove('listening'); if (!handled && this.state === 'playing' && this.player.superTimer <= 0) this.toast('沒聽清楚…再按一次🎤，大聲說「爸爸好帥」', 2400); },
            onError: (err) => { if (err === 'not-allowed' || err === 'service-not-allowed' || err === 'audio-capture' || err === 'network' || err === 'language-not-supported') fallback('這裡用不了麥克風，直接變身！'); }
        });
        if (ok) { this.micBtn.classList.add('listening'); this.toast('🎤 請大聲說：爸爸好帥！', 0); }
        else if (!voice.supported) fallback('這個瀏覽器不能語音辨識，直接變身！');
    }
    activateSuper() {
        const p = this.player;
        if (this.state !== 'playing' || p.superTimer > 0 || this.superCool > 0) return false;
        p.superTimer = SUPER_TIME; p.hp = p.maxHp; p.chargeFrames = 0; p.invincibleFrames = 0; p.isKnockedBack = false;
        this.superKills = 0; this.swarmT = 0; this.ebullets.length = 0;
        this.flash = 1; this.shake = 14;
        this.banner = { text: '超級Q妹模式！！', sub: '爸爸好帥 → 怪物大量出現，盡情打吧！', frames: 130, max: 130 };
        this.fx.burst(p.x + p.width / 2, p.y + p.height / 2, 34, { color: ['#FFD400', '#FFF6B0', '#FFFFFF'], speed: 7, life: 34, size: 5, g: 0, shape: 'ci' });
        audio.sfx('boom'); audio.jingle('weapon');
        p.say('爸爸最帥！變身！', 110); speak('爸爸最帥！超級Q妹出擊！', 1.8, 1.1);
        return true;
    }
    endSuper() {
        const p = this.player; this.superCool = 60 * 6;
        let boom = 0;
        for (const e of this.level.enemies) if (!e.isBoss && e.swarm && !e.dead) { e.dead = true; e.silent = true; boom++; }   // 剩下的怪隨能量消失
        this.banner = { text: '變身結束', sub: `這次擊倒了 ${this.superKills} 隻！爸爸最棒！`, frames: 150, max: 150 };
        p.say(this.superKills >= 20 ? '好爽！爸爸好帥！' : '呼～爸爸好帥！', 100);
        audio.sfx('pause');
    }
    spawnSwarm() {
        const L = this.level, p = this.player, T = L.theme;
        let kind = T.swarm[(Math.random() * T.swarm.length) | 0];
        const side = Math.random() < 0.65 ? 1 : -1, d0 = ENEMY_DEFS[kind];
        const x = clamp(p.x + side * (VIEW_W * 0.6 + Math.random() * 140), 50, L.width - 90);
        let y;
        if (ENEMY_DEFS[kind].fly) y = 100 + Math.random() * 170;
        else {
            const sg = L.segs.find(s => x > s.l + 12 && x + d0.w < s.r - 12);
            if (!sg) { kind = 'BAT'; y = 110 + Math.random() * 150; } else y = 380 - d0.h;
        }
        const e = new Enemy(kind, x, y, { pal: T.pal.a, swarm: true, hpMul: 0.5, skin: Math.random() < 0.3 ? 'b' : 'a' });
        e.dir = side > 0 ? -1 : 1; e.baseY = y; e.pl = 40; e.pr = L.width - 40;
        L.enemies.push(e);
        this.fx.burst(x + e.width / 2, y + e.height / 2, 7, { color: [T.pal.a[0], '#fff'], speed: 2.4, life: 16, size: 3, g: 0 });
    }

    // ---------- 戰鬥結算 ----------
    onBossAggro(b) {
        this.banner = { text: '⚠ WARNING ⚠', sub: `${b.name} 出現！${b.tip ? '\n弱點：' + b.tip : ''}`, frames: 140, max: 140 };
        audio.sfx('warn');
    }
    hitEnemy(e, b) {
        const sup = this.player.superTimer > 0, dmg = b.damage * (sup && !e.isBoss ? 3 : 1), weak = e.takeDamage(dmg, b.type);
        const cx = clamp(b.x + b.width / 2, e.x, e.x + e.width), cy = b.y + b.height / 2;
        this.fx.burst(cx, cy, weak ? 9 : 5, { color: weak ? ['#FFD400', '#FFFFFF'] : ['#FFFFFF', '#FFE66D'], speed: 3.4, life: 18, size: 3, g: 0.05 });
        audio.sfx(weak ? 'weak' : e.isBoss ? 'bossHit' : 'hit');
        if (weak) this.fx.text(e.x + e.width / 2, e.y - 12, '弱點！', '#FFD400', 24);
        if (e.isBoss) this.shake = Math.max(this.shake, 3);
    }
    onEnemyDead(e) {
        const cx = e.x + e.width / 2, cy = e.y + e.height / 2;
        if (e.isBoss) {
            this.fx.burst(cx, cy, 46, { color: ['#FFD400', '#FF6B35', '#FFFFFF', '#FF4D6D'], speed: 7, life: 44, size: 5, g: 0.1, shape: 'ci' });
            audio.sfx('boom'); this.shake = 16; this.flash = 0.7; this.ebullets.length = 0;
            for (const o of this.level.enemies) if (o !== e && !o.dead) { o.dead = true; o.silent = true; }
            const r = this.level.theme.reward;
            if (r) { this.player.unlockWeapon(r); this.newWeapon = WEAPON_TYPES[r].name; speak(`擊敗頭目！獲得新絕招：${WEAPON_TYPES[r].short}`); }
            this.stageClear(); return;
        }
        const pal = e.pal;
        this.fx.burst(cx, cy, e.silent ? 8 : 16, { color: [pal[0], pal[2], '#FFFFFF'], speed: 4, life: 26, size: 4, g: 0.15, shape: e.silent ? 'sq' : 'ci' });
        if (e.silent || e.y > 480) return;
        audio.sfx('kill'); this.kills++; this.combo++; this.comboT = 150;
        if (this.player.superTimer > 0) this.superKills++;
        if (this.combo >= 3) this.fx.text(cx, cy - 22, `${this.combo} COMBO!`, this.combo >= 10 ? '#FF5E97' : '#FFE66D', Math.min(42, 20 + this.combo));
        if (Math.random() < (this.player.superTimer > 0 ? 0.08 : 0.24)) this.pickups.push(new Pickup(cx - 11, cy - 10, 3));
    }
    stageClear() {
        if (this.state !== 'playing') return;
        this.state = 'clear'; this.clearAnim = 150; audio.stopMusic(); voice.stop(); this.hideToast();
        audio.jingle(this.newWeapon ? 'weapon' : 'clear');
        if (!this.newWeapon) speak('過關啦！');
        this.combo = 0;
        if (this.stage < this.maxStage) this.saveProgress(this.stage + 1);
    }
    onFall() {
        const p = this.player;
        if (p.superTimer <= 0) { p.hp = Math.max(0, p.hp - CONFIG.PIT_DAMAGE); audio.sfx('hurt'); }
        if (p.hp <= 0) { this.onDeath(); return; }
        p.isSliding = false; p.height = p.normalHeight; p.width = p.normalWidth;
        p.x = p.lastSafe.x; p.y = p.lastSafe.y - 6; p.vx = 0; p.vy = 0; p.isKnockedBack = false;
        if (p.superTimer <= 0) p.invincibleFrames = CONFIG.INVINCIBLE_TIME;
    }
    onDeath() {
        if (this.state !== 'playing') return;
        this.state = 'dead'; this.deadAnim = 130; audio.stopMusic(); voice.stop(); this.hideToast(); audio.jingle('over');
        speak('沒關係，再來一次！'); this.combo = 0;
    }

    // ---------- 每一步的更新 ----------
    step() {
        this.t++;
        if (this.state === 'splash' || this.state === 'title') {
            this.fx.update();
            if (this.state === 'title' && ++this.singT % 900 === 0) sing();
            return;
        }
        if (this.state === 'paused') return;
        if (this.state === 'win') { this.fx.update(); if (this.t % 4 === 0) this.fx.burst(Math.random() * VIEW_W, -10, 2, { color: ['#FF5E97', '#FFD166', '#4CC9F0', '#06D6A0', '#FFF'], speed: 0.6, life: 130, size: 5, g: 0.06, angle: Math.PI / 2, spread: 0.8 }); return; }
        if (this.state === 'dead') { this.fx.update(); if (--this.deadAnim <= 0) this.beginStage(this.stage); return; }
        if (this.state === 'clear') {
            this.fx.update();
            if (--this.clearAnim <= 0) { if (this.stage < this.maxStage) this.beginStage(this.stage + 1); else this.win(); }
            return;
        }
        this.stepPlaying();
    }
    stepPlaying() {
        const p = this.player, L = this.level;
        p.update(this);
        if (p.y > H + 60) this.onFall();
        if (!L.isBossStage && checkAABB(p, L.goal)) { this.stageClear(); return; }

        const targetCam = p.x - VIEW_W * 0.35;
        this.cameraX += (targetCam - this.cameraX) * 0.1;
        this.cameraX = clamp(this.cameraX, 0, L.width - VIEW_W);

        // 超級Q妹：不斷湧出怪物讓你刷
        if (p.superTimer > 0) {
            this.swarmT++;
            if (this.swarmT % 15 === 0 && L.enemies.filter(e => !e.isBoss && !e.dead).length < 20) this.spawnSwarm();
            if (p.superTimer === 180) this.banner = { text: '力量快用完了！', sub: '', frames: 80, max: 80 };
            if (p.superTimer === 1) this.endSuper();
        } else if (this.superCool > 0) this.superCool--;

        // 我方子彈
        for (const b of this.bullets) {
            b.update(L.width, L.platforms);
            if (!b.ghost) for (const q of L.platforms) if (checkAABB(b, q) && b.type !== 'FIRE') { b.dead = true; this.fx.burst(b.x + (b.dir > 0 ? b.width : 0), b.y + b.height / 2, 4, { color: '#FFFFFF', speed: 2, life: 10, size: 2, g: 0 }); break; }
            for (const e of L.enemies) {
                if (b.dead) break;
                if (e.dead || (b.hits && b.hits.has(e))) continue;
                if (checkAABB(b, e)) { this.hitEnemy(e, b); if (b.hits) b.hits.add(e); else b.dead = true; }
            }
        }
        this.bullets = this.bullets.filter(b => !b.dead);

        // 敵人
        for (const e of L.enemies) {
            if (e.dead) continue;
            e.update(this);
            if (!e.dead && checkAABB(p, e)) {
                const dir = (p.x + p.width / 2 < e.x + e.width / 2) ? -1 : 1;
                if (p.takeDamage(e.dmg, dir)) { this.shake = Math.max(this.shake, 5); this.combo = 0; }
            }
        }
        for (const e of L.enemies) if (e.dead && !e.handled) { e.handled = true; this.onEnemyDead(e); if (this.state !== 'playing') return; }
        L.enemies = L.enemies.filter(e => !e.dead);

        // 敵方彈幕與落雷
        for (const eb of this.ebullets) {
            eb.update(L.platforms);
            if (!eb.dead && eb.active && checkAABB(p, eb)) {
                const dir = (p.x + p.width / 2 < eb.x + eb.width / 2) ? -1 : 1;
                if (p.takeDamage(eb.dmg, dir)) { this.shake = Math.max(this.shake, 5); this.combo = 0; }
                if (eb.kind === 'ball' || eb.kind === 'shard' || eb.kind === 'orb') eb.dead = true;
            }
        }
        this.ebullets = this.ebullets.filter(eb => !eb.dead);

        // 愛心
        for (const h of this.pickups) {
            h.update(L.platforms);
            if (!h.dead && checkAABB(p, h)) { h.dead = true; p.hp = Math.min(p.maxHp, p.hp + h.amt); audio.sfx('pickup'); this.fx.text(h.x + 10, h.y - 6, `+${h.amt}`, '#FF7A9C', 22); }
        }
        this.pickups = this.pickups.filter(h => !h.dead);

        if (this.comboT > 0 && --this.comboT === 0) this.combo = 0;
        this.fx.update();
        if (this.shake > 0) this.shake = Math.max(0, this.shake - 0.8);
        if (this.flash > 0) this.flash = Math.max(0, this.flash - 0.04);
        if (this.banner && --this.banner.frames <= 0) this.banner = null;
        if (p.hp <= 0) this.onDeath();

        if (this.t % 6 === 0) this.updateMicLabel();
    }
    updateMicLabel() {
        const p = this.player, b = this.micBtn;
        let label = '🎤 爸爸好帥', cls = '';
        if (p.superTimer > 0) { label = `⚡ ${Math.ceil(p.superTimer / 60)}`; cls = 'super'; }
        else if (this.superCool > 0) { label = `⏳ ${Math.ceil(this.superCool / 60)}`; cls = 'cool'; }
        if (b.textContent !== label) b.textContent = label;
        b.classList.toggle('super', cls === 'super'); b.classList.toggle('cool', cls === 'cool');
    }

    // ---------- 畫面 ----------
    drawGoalGate(ctx) {
        const g = this.level.goal, rx = g.x - this.cameraX, locked = this.level.isBossStage, t = this.t;
        ctx.save();
        ctx.fillStyle = locked ? 'rgba(120,120,140,0.35)' : 'rgba(255,94,151,0.28)'; ctx.fillRect(rx - 6, g.y - 6, g.width + 12, g.height + 12);
        ctx.fillStyle = locked ? 'rgba(120,120,140,0.5)' : `rgba(255,94,151,${0.4 + Math.sin(t * 0.1) * 0.1})`; ctx.fillRect(rx, g.y, g.width, g.height);
        ctx.strokeStyle = locked ? '#8A8A9A' : '#FF5E97'; ctx.lineWidth = 3; ctx.strokeRect(rx, g.y, g.width, g.height);
        ctx.font = `bold 24px ${FONT}`; ctx.textAlign = 'center'; ctx.fillStyle = '#FFF';
        ctx.fillText(locked ? '🔒' : '💖', rx + g.width / 2, g.y + g.height / 2 + 8);
        ctx.restore();
    }
    drawWorld(ctx) {
        const L = this.level, th = L.theme.plat, cam = this.cameraX;
        BG[this.stage](ctx, cam, this.t);
        for (const p of L.platforms) {
            const rx = p.x - cam;
            if (rx + p.width < -30 || rx > VIEW_W + 30 || p.y === 0) continue;
            drawPlatform(ctx, p, rx, p.y >= 380 ? p.height + this.worldShift + 20 : p.height, th, cam);
        }
        this.drawGoalGate(ctx);
        for (const h of this.pickups) h.draw(ctx, cam);
        for (const e of L.enemies) e.draw(ctx, cam);
        for (const eb of this.ebullets) eb.draw(ctx, cam);
        for (const b of this.bullets) b.draw(ctx, cam);
        this.player.draw(ctx, cam);
        this.fx.draw(ctx, cam);
    }
    drawTitleScene(ctx) {                                   // 標題畫面：Q妹在森林裡跑步
        const cam = this.t * 0.9, p = this.player;
        BG[1](ctx, cam, this.t);
        drawPlatform(ctx, { x: 0, y: 380, width: VIEW_W + 60, height: 70 }, -20, 70 + this.worldShift + 20, LEVELS[1].plat, cam);
        p.x = cam + VIEW_W * 0.3; p.y = 332; p.facing = 1; p.walkTimer = this.t; p.isGrounded = true; p.superTimer = 0; p.chargeFrames = 0; p.invincibleFrames = 0;
        p.draw(ctx, cam);

    }
    drawWinScene(ctx) {

        drawPlatform(ctx, { x: 0, y: 380, width: VIEW_W + 60, height: 70 }, -20, 70 + this.worldShift + 20, LEVELS[1].plat, 0);
        const p = this.player; p.x = VIEW_W * 0.42; p.y = 332; p.facing = 1; p.isGrounded = true; p.superTimer = 0; p.chargeFrames = 0; p.invincibleFrames = 0; p.walkTimer = this.t; p.draw(ctx, 0);
        drawDad(ctx, VIEW_W * 0.42 + 76, 380, this.t);
        this.fx.draw(ctx, 0);
    }
    drawHUD(ctx) {
        const p = this.player, wp = WEAPON_TYPES[p.currentWeapon], L = this.level, sup = p.superTimer > 0;
        ctx.save(); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
        const line = (text, y, color, size, x = 62) => { ctx.font = `800 ${size}px ${FONT}`; ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,0.65)'; ctx.strokeText(text, x, y); ctx.fillStyle = color; ctx.fillText(text, x, y); };
        line(`STAGE ${this.stage}/${this.maxStage}`, 34, '#FFF', 24);
        line(L.name, 62, '#FFE66D', 22);
        line(`${wp.icon} ${wp.short}`, 90, sup ? '#FFD400' : wp.dress, 22);
        p.unlockedWeapons.forEach((w, i) => {                // 已拿到的武器列
            const x = 62 + i * 40, y = 100, cur = w === p.currentWeapon;
            ctx.fillStyle = cur ? 'rgba(255,255,255,0.4)' : 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.roundRect(x, y, 34, 30, 8); ctx.fill();
            if (cur) { ctx.strokeStyle = '#FFE66D'; ctx.lineWidth = 2.5; ctx.stroke(); }
            ctx.font = `20px ${FONT}`; ctx.textAlign = 'center'; ctx.fillStyle = '#FFF'; ctx.fillText(WEAPON_TYPES[w].icon, x + 17, y + 23); ctx.textAlign = 'left';
        });
        const barX = 25, barY = 20, uw = 20, uh = 4, sp = 1.5;   // 血條
        ctx.fillStyle = '#000'; ctx.fillRect(barX - 3, barY - 3, uw + 6, (uh + sp) * p.maxHp + 6);
        for (let i = 0; i < p.maxHp; i++) {
            ctx.fillStyle = i < p.hp ? (p.hp <= 6 ? '#FF4757' : sup ? '#FFD400' : wp.dress) : '#333';
            ctx.fillRect(barX, barY + (p.maxHp - 1 - i) * (uh + sp), uw, uh);
        }
        let y = 148;
        if (p.chargeFrames > 8 && !sup) {                    // 集氣條：看得到什麼時候能放大招
            const f = Math.min(1, p.chargeFrames / CONFIG.CHARGE_LV2_TIME), full = f >= 1;
            ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(62, y - 12, 150, 16);
            ctx.fillStyle = full ? (this.t % 6 < 3 ? '#FFF' : CHARGE_COLORS[p.currentWeapon][1]) : CHARGE_COLORS[p.currentWeapon][0]; ctx.fillRect(64, y - 10, 146 * f, 12);
            ctx.fillStyle = '#FFF'; ctx.fillRect(64 + 146 * (CONFIG.CHARGE_LV1_TIME / CONFIG.CHARGE_LV2_TIME), y - 12, 2, 16);
            line(full ? '大招！放開！' : '集氣中', y + 20, '#FFF', 16); y += 30;
        }
        const b = this.boss;
        if (b && b.aggro && !b.dead) {                       // Boss 血條
            line(b.name, y + 14, '#FF8FA3', 18);
            ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(62, y + 20, Math.min(VIEW_W - 90, 320), 18);
            ctx.fillStyle = b.hp / b.maxHp > 0.33 ? '#FF4D6D' : '#FFD166'; ctx.fillRect(64, y + 22, (Math.min(VIEW_W - 90, 320) - 4) * Math.max(0, b.hp / b.maxHp), 14);
            y += 52;
        }
        if (sup) {                                           // 超級模式剩餘時間與擊倒數
            const tw = Math.min(VIEW_W - 90, 300);
            line(`⚡ 超級Q妹  擊倒 ${this.superKills}`, y + 14, '#FFE066', 20);
            ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(62, y + 20, tw, 12);
            ctx.fillStyle = '#FFD400'; ctx.fillRect(64, y + 22, (tw - 4) * (p.superTimer / SUPER_TIME), 8);
        }
        ctx.restore();
    }
    drawOverlays(ctx) {
        const maxW = VIEW_W - 30;
        if (this.flash > 0) { ctx.fillStyle = `rgba(255,248,200,${this.flash})`; ctx.fillRect(0, 0, VIEW_W, H); }
        const bn = this.banner;
        if (bn && this.state === 'playing') {                // 橫幅：關卡開頭、Boss 登場、變身
            const a = Math.min(1, bn.frames / 30, (bn.max - bn.frames) / 12 + 0.2);
            ctx.save(); ctx.globalAlpha = Math.max(0, a); ctx.textAlign = 'center';
            ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, H * 0.3 - 44, VIEW_W, bn.sub ? 130 : 70);
            const big = bn.text.includes('超級') ? '#FFD400' : bn.text.includes('WARNING') ? '#FF4D6D' : '#FFF';
            ctx.lineJoin = 'round'; ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,0.75)';
            let sz = 46; ctx.font = `900 ${sz}px ${FONT}`; while (sz > 20 && ctx.measureText(bn.text).width > maxW) { sz -= 2; ctx.font = `900 ${sz}px ${FONT}`; }
            ctx.strokeText(bn.text, VIEW_W / 2, H * 0.3 + 6); ctx.fillStyle = big; ctx.fillText(bn.text, VIEW_W / 2, H * 0.3 + 6);
            (bn.sub || '').split('\n').forEach((s, i) => { if (!s) return; let z = 22; ctx.font = `800 ${z}px ${FONT}`; while (z > 14 && ctx.measureText(s).width > maxW) { z -= 1; ctx.font = `800 ${z}px ${FONT}`; } ctx.lineWidth = 4; ctx.strokeText(s, VIEW_W / 2, H * 0.3 + 40 + i * 28); ctx.fillStyle = '#FFE66D'; ctx.fillText(s, VIEW_W / 2, H * 0.3 + 40 + i * 28); });
            ctx.restore();
        }
        if (this.state === 'clear') {
            ctx.save(); ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, VIEW_W, H); ctx.textAlign = 'center';
            if (this.newWeapon) {
                fitText(ctx, '🎉 YOU GOT A NEW WEAPON! 🎉', VIEW_W / 2, H / 2 - 30, maxW, 36, '#FFD166');
                fitText(ctx, `【${this.newWeapon}】`, VIEW_W / 2, H / 2 + 18, maxW, 26, '#00F2FE');
                fitText(ctx, '按住攻擊集氣，放開就是大招！', VIEW_W / 2, H / 2 + 56, maxW, 22, '#FFFFFF');
            } else {
                fitText(ctx, '✨ STAGE CLEAR! ✨', VIEW_W / 2, H / 2 - 10, maxW, 38, '#FFE66D');
                if (this.kills) fitText(ctx, `累計擊倒 ${this.kills} 隻`, VIEW_W / 2, H / 2 + 34, maxW, 22, '#FFFFFF');
            }
            ctx.restore();
        } else if (this.state === 'dead') {
            ctx.save(); ctx.fillStyle = 'rgba(20,0,10,0.72)'; ctx.fillRect(0, 0, VIEW_W, H); ctx.textAlign = 'center';
            fitText(ctx, '💔 沒關係，再來一次！', VIEW_W / 2, H / 2 - 6, maxW, 38, '#FF8FA3');
            fitText(ctx, '爸爸還在等你救他喔', VIEW_W / 2, H / 2 + 34, maxW, 22, '#FFFFFF');
            ctx.restore();
        }
    }
    draw() {
        const ctx = this.ctx;
        ctx.setTransform(this.scale, 0, 0, this.scale, 0, 0);
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, VIEW_W, H);
        ctx.save();
        const sx = this.shake > 0 ? (Math.random() - 0.5) * this.shake : 0, sy = this.shake > 0 ? (Math.random() - 0.5) * this.shake : 0;
        ctx.translate(sx, sy - this.worldShift);
        if (this.state === 'splash' || this.state === 'title') this.drawTitleScene(ctx);
        else if (this.state === 'win') this.drawWinScene(ctx);
        else this.drawWorld(ctx);
        ctx.restore();
        if (this.state !== 'splash' && this.state !== 'title' && this.state !== 'win') this.drawHUD(ctx);
        this.drawOverlays(ctx);
    }

    // 固定 60 步／秒：畫面更新率不同（60/90/120/144Hz）遊戲速度都一樣
    loop(ts) {
        requestAnimationFrame(this.loop);
        if (this.lastTs === undefined) this.lastTs = ts;
        const dt = Math.min(ts - this.lastTs, 100); this.lastTs = ts; this.acc += dt;
        let n = 0;
        while (this.acc >= STEP_MS - 1 && n < 5) { this.step(); this.acc -= STEP_MS; n++; }
        if (n === 5) this.acc = 0;
        this.draw();
    }
}

window.onload = () => { window.game = new Game(); };
</script>
