<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Q妹救爸記</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%; height: 100%;
            background-color: #0b0d14; color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", "PingFang TC", sans-serif;
            overflow: hidden; touch-action: none; overscroll-behavior: none;
        }
        #viewport-wrapper {
            position: fixed; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: #000;
        }
        canvas { display: block; }

        /* ---------- 觸控操作區（字體放大：使用者老花眼） ---------- */
        .touch-ui { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
        .btn-group {
            position: absolute; bottom: calc(22px + env(safe-area-inset-bottom, 0px));
            pointer-events: auto; display: flex; gap: 14px;
        }
        .d-pad { left: calc(20px + env(safe-area-inset-left, 0px)); }
        .action-pad { right: calc(20px + env(safe-area-inset-right, 0px)); align-items: flex-end; }
        .v-btn {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 50%; background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.45); color: #fff; font-weight: 800;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px);
            transition: transform 0.06s; font-family: inherit;
        }
        .v-btn:active, .v-btn.active {
            transform: scale(0.92); background: rgba(255, 107, 139, 0.65); border-color: #ff6b8b;
        }
        .btn-dir { width: 72px; height: 72px; font-size: 30px; }
        .btn-jump { width: 72px; height: 72px; font-size: 24px; background: rgba(76, 201, 240, 0.25); border-color: #4cc9f0; }
        .btn-slide { width: 60px; height: 60px; font-size: 21px; margin-bottom: 6px; background: rgba(255, 214, 102, 0.25); border-color: #ffd166; }
        .btn-shoot { width: 84px; height: 84px; font-size: 24px; background: rgba(255, 94, 151, 0.35); border-color: #ff5e97; }
        .btn-shoot.charging { animation: pulseGlow 0.4s infinite alternate; }
        @keyframes pulseGlow {
            from { box-shadow: 0 0 10px #ff5e97; border-color: #fff; }
            to { box-shadow: 0 0 25px #ffd166; border-color: #ffd166; }
        }
        .btn-label { font-size: 12px; opacity: 0.85; margin-top: -2px; letter-spacing: 0.04em; }
        .btn-top-bar {
            position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px));
            display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; max-width: 100%;
            pointer-events: auto;
        }
        .small-btn {
            height: 44px; min-width: 44px; padding: 0 14px; font-size: 17px; font-weight: 800; font-family: inherit;
            border-radius: 22px; background: rgba(0, 0, 0, 0.62);
            border: 2px solid rgba(255, 255, 255, 0.45); color: #fff;
        }
        .small-btn:active { background: rgba(255, 107, 139, 0.7); }
        .btn-weapon-toggle { background: rgba(255, 107, 139, 0.7); border-color: #ffd166; }
        @media (pointer: coarse) { .key-hint { display: none !important; } }

        /* ---------- 直立手機版面：遊戲畫面貼上緣、操作區在下方拇指範圍 ---------- */
        body.portrait #viewport-wrapper { align-items: flex-start; }
        body.portrait .btn-top-bar { top: calc(var(--canvas-bottom, 260px) + 8px); left: 0; right: 0; justify-content: center; }
        body.portrait .btn-group { bottom: calc(26px + env(safe-area-inset-bottom, 0px)); gap: 10px; }
        body.portrait .d-pad { left: 12px; }
        body.portrait .action-pad { right: 12px; width: 46vw; flex-wrap: wrap-reverse; justify-content: flex-end; align-content: flex-start; align-items: flex-start; }
        body.portrait .btn-dir { width: min(19vw, 96px); height: min(19vw, 96px); font-size: 34px; }
        body.portrait .btn-jump { order: 1; width: min(19vw, 96px); height: min(19vw, 96px); font-size: 24px; }
        body.portrait .btn-shoot { order: 2; width: min(22vw, 104px); height: min(22vw, 104px); font-size: 24px; }
        body.portrait .btn-slide { order: 3; width: min(15vw, 72px); height: min(15vw, 72px); margin-bottom: 0; font-size: 21px; }
        body.portrait .btn-label { font-size: 13px; }
    </style>
</head>
<body>

<div id="viewport-wrapper">
    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <div class="touch-ui">
        <div class="btn-top-bar">
            <button class="small-btn btn-weapon-toggle" id="btn-weapon">換武器<span class="key-hint"> (E)</span></button>
            <button class="small-btn" id="btn-next">跳關<span class="key-hint"> (N)</span></button>
            <button class="small-btn" id="btn-reset">重玩<span class="key-hint"> (R)</span></button>
        </div>

        <div class="btn-group d-pad" id="d-pad">
            <button class="v-btn btn-dir" id="btn-left">◀</button>
            <button class="v-btn btn-dir" id="btn-right">▶</button>
        </div>

        <div class="btn-group action-pad">
            <button class="v-btn btn-slide" id="btn-slide"><span>滑</span><span class="btn-label">SLIDE</span></button>
            <button class="v-btn btn-jump" id="btn-jump"><span>跳</span><span class="btn-label">JUMP</span></button>
            <button class="v-btn btn-shoot" id="btn-shoot"><span>攻擊</span><span class="btn-label">SHOOT</span></button>
        </div>
    </div>
</div>

<script>
// ==========================================
// 1. 核心參數與武器庫
// ==========================================
const H = 450;                                // 遊戲邏輯高度；寬度 VIEW_W 會依螢幕（橫放／直立）自動調整
let VIEW_W = 800;
const STEP_MS = 1000 / 60;                    // 固定每秒 60 次更新：120Hz 的手機也不會變兩倍快
const FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function fitText(ctx, text, x, y, maxW, size, color) {   // 文字太寬就自動縮小，直立的窄畫面才不會被切掉
    let sz = size;
    ctx.font = `bold ${sz}px ${FONT}`;
    while (sz > 14 && ctx.measureText(text).width > maxW) { sz -= 2; ctx.font = `bold ${sz}px ${FONT}`; }
    ctx.fillStyle = color; ctx.fillText(text, x, y);
}

const CONFIG = {
    GRAVITY: 0.55, PLAYER_SPEED: 4.2, JUMP_FORCE: -11.5, MIN_JUMP_FORCE: -4.0,
    SLIDE_SPEED: 7.2, SLIDE_DURATION: 24, KNOCKBACK_X: 3.5, KNOCKBACK_Y: -4.0,
    INVINCIBLE_TIME: 75, CHARGE_LV1_TIME: 35, CHARGE_LV2_TIME: 80
};

const WEAPON_TYPES = {
    NORMAL: { id: 'NORMAL', name: '神奇水壺 (普通)', icon: '💧', dress: '#7CA9E8', stripe: 'rgba(255,255,255,0.7)', bottle: '#FF5E97' },
    FIRE: { id: 'FIRE', name: '烈焰火球 (Flame Burst)', icon: '🔥', dress: '#E63946', stripe: '#FFE66D', bottle: '#F77F00' },
    ICE: { id: 'ICE', name: '冰晶飛輪 (Ice Cutter)', icon: '❄️', dress: '#00B4D8', stripe: '#E0FBFC', bottle: '#90E0EF' },
    THUNDER: { id: 'THUNDER', name: '雷光擴散 (Spark Thunder)', icon: '⚡', dress: '#F4A261', stripe: '#FFE66D', bottle: '#E76F51' }
};

function speak(text, pitch = 1.6, rate = 1.15) {
    if ('speechSynthesis' in window && 'SpeechSynthesisUtterance' in window) {
        try {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'zh-TW'; u.pitch = pitch; u.rate = rate;
            window.speechSynthesis.speak(u);
        } catch(e) {}
    }
}

// ==========================================
// 2. 輸入控制器
// ==========================================
class InputHandler {
    constructor() {
        this.keys = {};
        const GAME_KEYS = new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space']);
        window.addEventListener('keydown', (e) => { this.keys[e.code] = true; if (GAME_KEYS.has(e.code)) e.preventDefault(); });
        window.addEventListener('keyup', (e) => { this.keys[e.code] = false; if (GAME_KEYS.has(e.code)) e.preventDefault(); });
        window.addEventListener('blur', () => { this.keys = {}; });

        this.bindPad('d-pad', [['btn-left', 'KeyA'], ['btn-right', 'KeyD']]);
        this.bindHold('btn-jump', 'KeyK');
        this.bindHold('btn-shoot', 'KeyJ');
        this.bindHold('btn-slide', 'KeyL');
    }
    // 十字鍵：依手指橫向位置判斷左／右，手指不放開直接滑到另一邊也會跟著換方向
    bindPad(id, items) {
        const box = document.getElementById(id);
        if (!box) return;
        const els = items.map(([bid, code]) => ({ el: document.getElementById(bid), code }));
        const held = new Map();
        const refresh = () => {
            const codes = [...held.values()];
            for (const it of els) { const on = codes.includes(it.code); this.keys[it.code] = on; it.el.classList.toggle('active', on); }
        };
        const pick = (e) => {
            let best = null, bd = Infinity;
            for (const it of els) {
                const r = it.el.getBoundingClientRect(), d = Math.abs(e.clientX - (r.left + r.right) / 2);
                if (d < bd) { bd = d; best = it.code; }
            }
            return best;
        };
        box.addEventListener('pointerdown', (e) => { e.preventDefault(); try { box.setPointerCapture(e.pointerId); } catch (err) {} held.set(e.pointerId, pick(e)); refresh(); });
        box.addEventListener('pointermove', (e) => { if (held.has(e.pointerId)) { held.set(e.pointerId, pick(e)); refresh(); } });
        const up = (e) => { held.delete(e.pointerId); refresh(); };
        box.addEventListener('pointerup', up);
        box.addEventListener('pointercancel', up);
        box.addEventListener('lostpointercapture', up);
    }
    // 按住型按鈕（跳／攻擊／滑）：可多指同時按
    bindHold(id, code) {
        const btn = document.getElementById(id);
        if (!btn) return;
        const held = new Set();
        const set = () => {
            const on = held.size > 0;
            this.keys[code] = on; btn.classList.toggle('active', on);
            if (!on && id === 'btn-shoot') btn.classList.remove('charging');
        };
        btn.addEventListener('pointerdown', (e) => { e.preventDefault(); try { btn.setPointerCapture(e.pointerId); } catch (err) {} held.add(e.pointerId); set(); });
        const up = (e) => { held.delete(e.pointerId); set(); };
        btn.addEventListener('pointerup', up);
        btn.addEventListener('pointercancel', up);
        btn.addEventListener('lostpointercapture', up);
    }
    // 點一下型按鈕（換武器／跳關／重玩）：觸控與滑鼠都只觸發一次
    bindTap(id, fn) {
        const btn = document.getElementById(id);
        if (!btn) return;
        btn.addEventListener('pointerdown', (e) => { e.preventDefault(); btn.classList.add('active'); fn(); });
        const up = () => btn.classList.remove('active');
        btn.addEventListener('pointerup', up);
        btn.addEventListener('pointercancel', up);
        btn.addEventListener('pointerleave', up);
    }
    isDown(codes) { return codes.some(c => this.keys[c]); }
}

function checkAABB(r1, r2) {
    return (
        r1.x < r2.x + r2.width && r1.x + r1.width > r2.x &&
        r1.y < r2.y + r2.height && r1.y + r1.height > r2.y
    );
}

// ==========================================
// 3. 子彈實體
// ==========================================
class Bullet {
    constructor(x, y, dir, type = 'NORMAL', chargeLevel = 0) {
        this.type = type;
        this.dir = dir;
        this.chargeLevel = chargeLevel;
        this.markedForDeletion = false;
        this.animFrame = 0;
        this.vy = 0;
        this.penetrate = false;

        if (type === 'NORMAL') {
            if (chargeLevel === 0) { this.width = 14; this.height = 10; this.speed = 9; this.damage = 1; }
            else if (chargeLevel === 1) { this.width = 22; this.height = 18; this.speed = 10.5; this.damage = 2; }
            else { this.width = 42; this.height = 32; this.speed = 13; this.damage = 6; }
        } else if (type === 'FIRE') {
            this.width = 24; this.height = 24; this.speed = 7.5; this.damage = 3; this.vy = 2.5;
        } else if (type === 'ICE') {
            this.width = 28; this.height = 20; this.speed = 11; this.damage = 3; this.penetrate = true;
        } else if (type === 'THUNDER') {
            this.width = 22; this.height = 22; this.speed = 9.5; this.damage = 3;
        }

        this.x = dir === 1 ? x : x - this.width;
        this.y = y - this.height / 2;
    }

    update(levelWidth, platforms) {
        this.x += this.speed * this.dir;
        this.y += this.vy;
        this.animFrame++;

        if (this.type === 'FIRE') {
            for (const p of platforms) {
                if (checkAABB(this, p)) {
                    this.y = p.y - this.height;
                    this.vy = 0;
                    break;
                }
            }
        }

        if (this.x < -100 || this.x > levelWidth + 100 || this.y > 480) {
            this.markedForDeletion = true;
        }
    }

    draw(ctx, cameraX) {
        ctx.save();
        const rx = this.x - cameraX;
        const cx = rx + this.width / 2;
        const cy = this.y + this.height / 2;

        if (this.type === 'NORMAL') {
            if (this.chargeLevel < 2) {
                ctx.fillStyle = this.chargeLevel === 0 ? '#4CC9F0' : '#06D6A0';
                ctx.beginPath(); ctx.ellipse(cx, cy, this.width / 2, this.height / 2, 0, 0, Math.PI * 2); ctx.fill();
            } else {
                const grad = ctx.createRadialGradient(cx, cy, 4, cx, cy, this.width / 2);
                grad.addColorStop(0, '#FFF'); grad.addColorStop(0.5, '#4CC9F0'); grad.addColorStop(1, '#FF5E97');
                ctx.fillStyle = grad;
                ctx.beginPath(); ctx.arc(cx, cy, this.width / 2, 0, Math.PI * 2); ctx.fill();
            }
        } else if (this.type === 'FIRE') {
            ctx.shadowColor = '#FF758F'; ctx.shadowBlur = 12;
            ctx.fillStyle = '#E63946'; ctx.beginPath(); ctx.arc(cx, cy, this.width / 2, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#FFE66D'; ctx.beginPath(); ctx.arc(cx, cy, this.width / 3.5, 0, Math.PI * 2); ctx.fill();
        } else if (this.type === 'ICE') {
            ctx.shadowColor = '#4CC9F0'; ctx.shadowBlur = 10;
            ctx.fillStyle = '#E0FAFF'; ctx.strokeStyle = '#00B4D8'; ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < 4; i++) {
                const a = (this.animFrame * 0.2) + (i * Math.PI / 2);
                const ox = cx + Math.cos(a) * (this.width / 2);
                const oy = cy + Math.sin(a) * (this.height / 2);
                if (i === 0) ctx.moveTo(ox, oy); else ctx.lineTo(ox, oy);
            }
            ctx.closePath(); ctx.fill(); ctx.stroke();
        } else if (this.type === 'THUNDER') {
            ctx.shadowColor = '#FFE66D'; ctx.shadowBlur = 12;
            ctx.fillStyle = '#FFE66D'; ctx.beginPath(); ctx.arc(cx, cy, this.width / 2, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#FFF'; ctx.fillRect(cx - 3, cy - 8, 6, 16); ctx.fillRect(cx - 8, cy - 3, 16, 6);
        }
        ctx.restore();
    }
}

// ==========================================
// 4. 敵人與 Boss
// ==========================================
class Enemy {
    constructor(x, y, pLeft, pRight, bossType = null) {
        this.x = x; this.y = y;
        this.bossType = bossType;
        this.isBoss = !!bossType;
        this.width = this.isBoss ? 68 : 32;
        this.height = this.isBoss ? 68 : 32;
        this.vx = this.isBoss ? 1.5 : 1.6;
        this.vy = 0;
        this.patrolLeft = pLeft;
        this.patrolRight = pRight;
        this.maxHp = this.isBoss ? (bossType === 'FINAL_BOSS' ? 24 : 16) : 3;
        this.hp = this.maxHp;
        this.hitFlash = 0;
        this.markedForDeletion = false;
        this.timer = 0;
    }

    takeDamage(dmg) {
        this.hp -= dmg;
        this.hitFlash = 10;
        if (this.hp <= 0) this.markedForDeletion = true;
    }

    update(platforms) {
        if (this.hitFlash > 0) this.hitFlash--;
        this.timer++;

        if (this.isBoss) {
            this.x += this.vx;
            if (this.x <= this.patrolLeft) { this.x = this.patrolLeft; this.vx = Math.abs(this.vx); }
            else if (this.x + this.width >= this.patrolRight) { this.x = this.patrolRight - this.width; this.vx = -Math.abs(this.vx); }

            this.vy += 0.45;
            this.y += this.vy;
            for (const p of platforms) {
                if (checkAABB(this, p) && this.vy > 0) {
                    this.y = p.y - this.height;
                    this.vy = 0;
                    if (this.timer % 120 === 0) this.vy = -9;
                }
            }
        } else {
            this.x += this.vx;
            if (this.x <= this.patrolLeft) { this.x = this.patrolLeft; this.vx = Math.abs(this.vx); }
            else if (this.x + this.width >= this.patrolRight) { this.x = this.patrolRight - this.width; this.vx = -Math.abs(this.vx); }
        }
    }

    draw(ctx, cameraX) {
        ctx.save();
        const rx = this.x - cameraX;
        const flash = (this.hitFlash > 0 && Math.floor(this.hitFlash / 2) % 2 === 0);

        if (this.isBoss) {
            let bColor = '#E63946';
            if (this.bossType === 'FIRE_BOSS') bColor = '#D90429';
            else if (this.bossType === 'ICE_BOSS') bColor = '#0077B6';
            else if (this.bossType === 'THUNDER_BOSS') bColor = '#F77F00';
            else if (this.bossType === 'FINAL_BOSS') bColor = '#5A189A';

            ctx.fillStyle = flash ? '#FFF' : bColor;
            ctx.beginPath(); ctx.roundRect(rx, this.y, this.width, this.height, 16); ctx.fill();
            ctx.strokeStyle = '#FFE66D'; ctx.lineWidth = 3; ctx.stroke();

            ctx.fillStyle = '#FFE66D';
            ctx.beginPath();
            ctx.arc(rx + this.width / 2 + (this.vx > 0 ? 10 : -10), this.y + 26, 13, 0, Math.PI * 2);
            ctx.fill();

            const barW = 60;
            ctx.fillStyle = '#000'; ctx.fillRect(rx + 4, this.y - 14, barW, 7);
            ctx.fillStyle = '#FFD166'; ctx.fillRect(rx + 4, this.y - 14, (this.hp / this.maxHp) * barW, 7);
        } else {
            ctx.fillStyle = flash ? '#FFF' : '#FF4757';
            ctx.beginPath(); ctx.roundRect(rx, this.y, this.width, this.height, 8); ctx.fill();
            ctx.fillStyle = '#FFEAA7';
            const eyeX = this.vx > 0 ? rx + 18 : rx + 6;
            ctx.fillRect(eyeX, this.y + 8, 8, 8);
        }
        ctx.restore();
    }
}

// ==========================================
// 5. Q版小女孩主角
// ==========================================
class Player {
    constructor(x, y) {
        this.startX = x; this.startY = y;
        this.currentWeapon = 'NORMAL';
        this.unlockedWeapons = ['NORMAL'];
        this.reset();
    }

    reset(x = this.startX, y = this.startY) {
        this.x = x; this.y = y;
        this.normalWidth = 34; this.normalHeight = 48; this.slideHeight = 24;
        this.width = this.normalWidth; this.height = this.normalHeight;
        this.vx = 0; this.vy = 0; this.facing = 1;
        this.isGrounded = false; this.isSliding = false; this.slideTimer = 0;
        this.isKnockedBack = false;
        this.maxHp = 28; this.hp = this.maxHp;
        this.invincibleFrames = 0; this.chargeFrames = 0;
        this.shootKeyPrev = false; this.weaponKeyPrev = false;
        this.walkTimer = 0; this.speechTimer = 0; this.speechText = '爸爸好帥！✨';
    }

    unlockWeapon(typeId) {
        if (!this.unlockedWeapons.includes(typeId)) {
            this.unlockedWeapons.push(typeId);
            this.currentWeapon = typeId;
        }
    }

    cycleWeapon() {
        if (this.unlockedWeapons.length <= 1) return;
        const idx = this.unlockedWeapons.indexOf(this.currentWeapon);
        const nextIdx = (idx + 1) % this.unlockedWeapons.length;
        this.currentWeapon = this.unlockedWeapons[nextIdx];
        speak(`裝備${WEAPON_TYPES[this.currentWeapon].name.split(' ')[0]}`);
    }

    takeDamage(dmg, knockbackDir) {
        if (this.invincibleFrames > 0) return;
        this.hp = Math.max(0, this.hp - dmg);
        this.invincibleFrames = CONFIG.INVINCIBLE_TIME;
        this.isKnockedBack = true; this.isSliding = false;
        this.vx = knockbackDir * CONFIG.KNOCKBACK_X; this.vy = CONFIG.KNOCKBACK_Y;
    }

    canStandUp(platforms) {
        const checkRect = {
            x: this.x, y: this.y - (this.normalHeight - this.slideHeight),
            width: this.normalWidth, height: this.normalHeight
        };
        for (const p of platforms) if (checkAABB(checkRect, p)) return false;
        return true;
    }

    update(input, platforms, bullets) {
        if (this.invincibleFrames > 0) {
            this.invincibleFrames--;
            if (this.invincibleFrames === 0) this.isKnockedBack = false;
        }
        if (this.speechTimer > 0) this.speechTimer--;

        const weaponDown = input.isDown(['KeyE', 'KeyQ']);
        if (weaponDown && !this.weaponKeyPrev) this.cycleWeapon();
        this.weaponKeyPrev = weaponDown;

        const left = input.isDown(['KeyA', 'ArrowLeft']);
        const right = input.isDown(['KeyD', 'ArrowRight']);
        const jump = input.isDown(['KeyK', 'Space', 'ArrowUp', 'KeyW']);
        const down = input.isDown(['KeyS', 'ArrowDown']);
        const slide = input.isDown(['KeyL', 'KeyX']) || (down && jump);
        const shoot = input.isDown(['KeyJ', 'KeyZ']);

        const shootBtn = document.getElementById('btn-shoot');
        if (shootBtn) {
            if (this.chargeFrames >= CONFIG.CHARGE_LV2_TIME) shootBtn.classList.add('charging');
            else shootBtn.classList.remove('charging');
        }

        if (!this.isKnockedBack) {
            if (slide && this.isGrounded && !this.isSliding) {
                this.isSliding = true;
                this.slideTimer = CONFIG.SLIDE_DURATION;
                this.height = this.slideHeight;
                this.y += (this.normalHeight - this.slideHeight);
            }

            if (this.isSliding) {
                this.vx = this.facing * CONFIG.SLIDE_SPEED;
                this.slideTimer--;
                if (this.slideTimer <= 0 && this.canStandUp(platforms)) {
                    this.isSliding = false;
                    this.height = this.normalHeight;
                    this.y -= (this.normalHeight - this.slideHeight);
                }
            } else {
                if (left && !right) { this.vx = -CONFIG.PLAYER_SPEED; this.facing = -1; this.walkTimer++; }
                else if (right && !left) { this.vx = CONFIG.PLAYER_SPEED; this.facing = 1; this.walkTimer++; }
                else { this.vx = 0; this.walkTimer = 0; }

                if (jump && this.isGrounded && !down) {
                    this.vy = CONFIG.JUMP_FORCE; this.isGrounded = false;
                }
            }

            if (!jump && this.vy < CONFIG.MIN_JUMP_FORCE) this.vy = CONFIG.MIN_JUMP_FORCE;
        }

        if (shoot) {
            if (this.currentWeapon === 'NORMAL') this.chargeFrames++;
        } else {
            if (this.shootKeyPrev) {
                const bx = this.facing === 1 ? this.x + this.width + 6 : this.x - 6;
                const by = this.y + (this.isSliding ? 12 : 26);

                if (this.currentWeapon === 'NORMAL') {
                    let clv = 0;
                    if (this.chargeFrames >= CONFIG.CHARGE_LV2_TIME) {
                        clv = 2;
                        speak("爸爸好帥！");
                        this.speechText = "爸爸好帥！✨"; this.speechTimer = 80;
                    } else if (this.chargeFrames >= CONFIG.CHARGE_LV1_TIME) {
                        clv = 1;
                    }
                    bullets.push(new Bullet(bx, by, this.facing, 'NORMAL', clv));
                } else {
                    bullets.push(new Bullet(bx, by, this.facing, this.currentWeapon, 0));
                }
            }
            this.chargeFrames = 0;
        }
        this.shootKeyPrev = shoot;

        this.vy += CONFIG.GRAVITY;

        this.x += this.vx;
        for (const p of platforms) {
            if (checkAABB(this, p)) {
                if (this.vx > 0) this.x = p.x - this.width;
                else if (this.vx < 0) this.x = p.x + p.width;
                this.vx = 0;
                if (this.isSliding && this.canStandUp(platforms)) {
                    this.isSliding = false;
                    this.height = this.normalHeight;
                    this.y -= (this.normalHeight - this.slideHeight);
                }
            }
        }

        this.isGrounded = false;
        this.y += this.vy;
        for (const p of platforms) {
            if (checkAABB(this, p)) {
                if (this.vy > 0) {
                    this.y = p.y - this.height; this.vy = 0;
                    this.isGrounded = true;
                    if (this.isKnockedBack) this.isKnockedBack = false;
                } else if (this.vy < 0) {
                    this.y = p.y + p.height; this.vy = 0;
                }
            }
        }
    }

    draw(ctx, cameraX) {
        if (this.invincibleFrames > 0 && Math.floor(this.invincibleFrames / 3) % 2 === 0) return;

        ctx.save();
        const cx = this.x - cameraX + this.width / 2;
        const cy = this.y + this.height / 2;
        const wp = WEAPON_TYPES[this.currentWeapon];

        if (this.speechTimer > 0) {
            ctx.save();
            const floatY = (80 - this.speechTimer) * 0.35;
            const bx = cx; const by = this.y - 28 - floatY;
            ctx.font = 'bold 20px -apple-system, "Microsoft JhengHei", sans-serif';
            const tw = ctx.measureText(this.speechText).width + 26;
            ctx.fillStyle = '#FFF'; ctx.strokeStyle = '#FF5E97'; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.roundRect(bx - tw / 2, by - 18, tw, 34, 14); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(bx - 5, by + 15); ctx.lineTo(bx, by + 23); ctx.lineTo(bx + 5, by + 15); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#FF2E75';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(this.speechText, bx, by);
            ctx.restore();
        }

        ctx.translate(cx, cy);
        ctx.scale(this.facing, 1);

        if (this.chargeFrames >= CONFIG.CHARGE_LV1_TIME) {
            ctx.save();
            const rc = this.chargeFrames >= CONFIG.CHARGE_LV2_TIME ? '#FF5E97' : '#06D6A0';
            ctx.strokeStyle = rc; ctx.shadowColor = rc; ctx.shadowBlur = 14; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.ellipse(0, 0, this.width * 0.75, this.height * 0.65, 0, 0, Math.PI * 2); ctx.stroke();
            ctx.restore();
        }

        const bounce = Math.sin(this.walkTimer * 0.4) * 2;
        const pAngle = this.isGrounded ? bounce * 0.08 : -0.2;

        if (this.isSliding) {
            ctx.fillStyle = wp.dress;
            ctx.beginPath(); ctx.roundRect(-16, -6, 28, 14, 6); ctx.fill();
            ctx.fillStyle = '#FFE2D1'; ctx.beginPath(); ctx.arc(6, -2, 10, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#2B1E16'; ctx.beginPath(); ctx.arc(4, -5, 10, Math.PI, Math.PI * 2); ctx.fill();
            this.drawBottle(ctx, 14, 0, wp.bottle);
        } else {
            ctx.fillStyle = '#2D1F17';
            ctx.save(); ctx.translate(-8, -12); ctx.rotate(-0.35 + pAngle);
            ctx.beginPath(); ctx.ellipse(0, 0, 7, 11, -0.2, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#FFE66D'; ctx.fillRect(-2, -7, 4, 3); ctx.restore();

            ctx.save(); ctx.translate(5, -12); ctx.rotate(0.35 - pAngle);
            ctx.beginPath(); ctx.ellipse(0, 0, 7, 11, 0.2, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#FFE66D'; ctx.fillRect(-2, -7, 4, 3); ctx.restore();

            ctx.fillStyle = '#FFE2D1'; ctx.fillRect(-8, 14, 5, 8); ctx.fillRect(3, 14, 5, 8);
            ctx.fillStyle = '#FFF'; ctx.beginPath(); ctx.roundRect(-9, 20, 7, 4, 2); ctx.roundRect(2, 20, 7, 4, 2); ctx.fill();

            ctx.fillStyle = wp.dress;
            ctx.beginPath(); ctx.moveTo(-11, 14); ctx.lineTo(-6, -1); ctx.lineTo(6, -1); ctx.lineTo(11, 14); ctx.closePath(); ctx.fill();
            ctx.strokeStyle = wp.stripe; ctx.lineWidth = 1.2;
            for (let sx = -8; sx <= 8; sx += 3.5) {
                ctx.beginPath(); ctx.moveTo(sx * 0.7, 0); ctx.lineTo(sx * 1.15, 14); ctx.stroke();
            }

            ctx.fillStyle = '#FFF'; ctx.beginPath();
            ctx.ellipse(-3, -1, 5, 3, -0.1, 0, Math.PI * 2); ctx.ellipse(3, -1, 5, 3, 0.1, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#FFE2D1'; ctx.beginPath(); ctx.arc(0, -9, 12, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(7, -6, 5, 0, Math.PI * 2); ctx.arc(-7, -6, 5, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#2D1F17'; ctx.beginPath(); ctx.arc(0, -11, 12.5, Math.PI * 0.85, Math.PI * 2.15); ctx.fill();
            ctx.beginPath(); ctx.roundRect(-9, -17, 18, 9,); ctx.fill();

            ctx.fillStyle = 'rgba(255, 120, 140, 0.55)';
            ctx.beginPath(); ctx.arc(5, -6, 2.5, 0, Math.PI * 2); ctx.arc(-5, -6, 2.5, 0, Math.PI * 2); ctx.fill();

            ctx.strokeStyle = '#222'; ctx.lineWidth = 1.6;
            ctx.beginPath(); ctx.arc(4, -8, 2.5, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
            ctx.beginPath(); ctx.arc(-2, -8, 2.5, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();

            ctx.strokeStyle = '#E05A47'; ctx.lineWidth = 1.2;
            ctx.beginPath(); ctx.arc(1, -4, 2, 0.2, Math.PI - 0.2); ctx.stroke();

            this.drawBottle(ctx, 10, 4, wp.bottle);
        }
        ctx.restore();
    }

    drawBottle(ctx, x, y, capColor) {
        ctx.save(); ctx.translate(x, y);
        ctx.fillStyle = '#FFE2D1'; ctx.beginPath(); ctx.arc(-2, 0, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(215, 235, 255, 0.85)'; ctx.strokeStyle = '#8ECAE6'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.roundRect(0, -5, 11, 14, 3); ctx.fill(); ctx.stroke();
        ctx.fillStyle = capColor; ctx.beginPath(); ctx.roundRect(-1, -9, 13, 5, 2); ctx.fill();
        ctx.fillRect(9, -7, 4, 3); ctx.restore();
    }
}

// ==========================================
// 6. 十大關卡生成
// ==========================================
function buildLevel(stageNum) {
    const metaList = [
        { name: "初生綠地", bg: "#0f2027", plat: "#1B4332", border: "#52B788", chasms: 0, slides: 0, enemies: 2 },
        { name: "滑壘糖果巷", bg: "#25131A", plat: "#491B2D", border: "#FF758F", chasms: 0, slides: 2, enemies: 3 },
        { name: "【烈焰巨怪】BOSS戰", bg: "#370617", plat: "#6A040F", border: "#F48C06", isBoss: true, bossType: 'FIRE_BOSS', reward: 'FIRE' },
        { name: "警衛巡邏街", bg: "#23180E", plat: "#452A15", border: "#F77F00", chasms: 1, slides: 1, enemies: 5 },
        { name: "無底深谷", bg: "#1C122C", plat: "#372056", border: "#9D4EDD", chasms: 3, slides: 1, enemies: 4 },
        { name: "【極凍雪魔】BOSS戰", bg: "#03045E", plat: "#023E8A", border: "#00B4D8", isBoss: true, bossType: 'ICE_BOSS', reward: 'ICE' },
        { name: "天空浮島", bg: "#0C2461", plat: "#1E3799", border: "#82CCDD", chasms: 4, slides: 1, enemies: 4 },
        { name: "疾走要塞", bg: "#2D3436", plat: "#636E72", border: "#D63031", chasms: 3, slides: 2, enemies: 6 },
        { name: "【轟雷魔像】BOSS戰", bg: "#2B2D42", plat: "#4A4E69", border: "#F77F00", isBoss: true, bossType: 'THUNDER_BOSS', reward: 'THUNDER' },
        { name: "【終極暗黑魔王】決戰", bg: "#2C061F", plat: "#4D0C27", border: "#FFD166", isBoss: true, bossType: 'FINAL_BOSS', reward: null }
    ];

    const meta = metaList[stageNum - 1];
    const length = 2000;
    const platforms = [
        { x: -30, y: 0, width: 30, height: 450 },
        { x: length, y: 0, width: 40, height: 450 }
    ];
    const enemies = [];

    if (meta.isBoss) {
        platforms.push({ x: 0, y: 380, width: length, height: 70 });
        platforms.push({ x: 260, y: 270, width: 140, height: 20 });
        platforms.push({ x: 560, y: 210, width: 140, height: 20 });
        platforms.push({ x: 860, y: 270, width: 140, height: 20 });
        enemies.push(new Enemy(1050, 312, 600, 1400, meta.bossType));
    } else {
        let curX = 0;
        const segLen = Math.floor(length / ((meta.chasms || 0) + 2));
        for (let i = 0; i <= (meta.chasms || 0) + 1; i++) {
            platforms.push({ x: curX, y: 380, width: segLen, height: 70 });
            curX += segLen + 110;
        }
        for (let x = 320; x < length - 300; x += 360) {
            platforms.push({ x: x, y: 220 + ((x / 100) % 3) * 45, width: 130, height: 20 });
        }
        if (meta.slides > 0) {
            for (let s = 0; s < meta.slides; s++) {
                platforms.push({ x: 550 + s * 550, y: 330, width: 200, height: 25 });
            }
        }
        for (let e = 0; e < meta.enemies; e++) {
            const ex = 400 + e * 260;
            enemies.push(new Enemy(ex, 348, ex - 120, ex + 120));
        }
    }

    return {
        id: stageNum, name: meta.name, width: length, theme: meta,
        isBossStage: meta.isBoss, reward: meta.reward,
        goal: { x: length - 120, y: 270, width: 44, height: 110 },
        platforms: platforms, enemies: enemies
    };
}

// ==========================================
// 7. 遊戲主循環 (已完全修復)
// ==========================================
class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.input = new InputHandler();
        this.scale = 1; this.acc = 0; this.lastTs = undefined; this.worldShift = 0;

        this.currentStage = 1;
        this.maxStage = 10;
        this.stageClearAnim = 0;
        this.newWeaponUnlocked = null;
        this.allCleared = false;

        this.player = new Player(80, 200);
        this.layout();
        this.loadStage(1);
        this.bindEvents();
        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);
    }

    // 依螢幕決定畫面大小：橫放＝鋪滿整個螢幕；直立＝畫面貼上緣、寬度鋪滿，下方留給操作按鈕
    layout() {
        const vw = window.innerWidth, vh = window.innerHeight;
        const portrait = vh > vw * 1.1;
        document.body.classList.toggle('portrait', portrait);
        let cw;
        if (portrait) {
            const availH = Math.max(220, vh - 250);
            VIEW_W = clamp(Math.round(vw * H / availH), 440, 800);   // 視野最窄 440，角色才不會縮太小
            cw = vw;
        } else {
            VIEW_W = clamp(Math.round(H * vw / vh), 640, 960);
            cw = Math.min(vw, vh * VIEW_W / H);
        }
        // 橫放時按鈕壓在畫面下方，把世界往上提 50，角色才不會被十字鍵蓋住；直立時按鈕在畫面外，不用提
        this.worldShift = portrait ? 0 : 50;
        const ch = cw * H / VIEW_W;
        this.canvas.style.width = cw + 'px';
        this.canvas.style.height = ch + 'px';
        this.scale = cw * Math.min(window.devicePixelRatio || 1, 2) / VIEW_W;     // 依螢幕像素密度放大，畫面不糊
        this.canvas.width = Math.round(VIEW_W * this.scale);
        this.canvas.height = Math.round(H * this.scale);
        document.documentElement.style.setProperty('--canvas-bottom', ch + 'px');
    }

    loadStage(stg) {
        this.currentStage = stg;
        this.level = buildLevel(stg);
        this.player.reset(80, 200);
        this.bullets = [];
        this.cameraX = 0;
        this.stageClearAnim = 0;
        this.newWeaponUnlocked = null;
        speak(`第${stg}關，${this.level.name}`);
    }

    bindEvents() {
        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            if (e.code === 'KeyR') this.loadStage(this.currentStage);
            if (e.code === 'KeyN') this.nextStage();
        });
        this.input.bindTap('btn-reset', () => this.loadStage(this.currentStage));
        this.input.bindTap('btn-next', () => this.nextStage());
        this.input.bindTap('btn-weapon', () => this.player.cycleWeapon());
        window.addEventListener('resize', () => this.layout());
        window.addEventListener('orientationchange', () => setTimeout(() => this.layout(), 250));
        if (window.visualViewport) window.visualViewport.addEventListener('resize', () => this.layout());
        document.addEventListener('contextmenu', (e) => e.preventDefault());
    }

    nextStage() {
        if (this.currentStage < this.maxStage) {
            this.loadStage(this.currentStage + 1);
        } else {
            this.allCleared = true;
            speak("恭喜全破！爸爸太帥了！最愛爸爸！");
        }
    }

    update() {
        if (this.allCleared) return;

        if (this.stageClearAnim > 0) {
            this.stageClearAnim--;
            if (this.stageClearAnim === 0) this.nextStage();
            return;
        }

        this.player.update(this.input, this.level.platforms, this.bullets);

        if (this.player.y > H + 80) this.player.reset(80, 200);

        if (checkAABB(this.player, this.level.goal)) {
            this.triggerStageClear();
        }

        const targetCamX = this.player.x - VIEW_W * 0.35;
        this.cameraX += (targetCamX - this.cameraX) * 0.1;
        this.cameraX = Math.max(0, Math.min(this.cameraX, this.level.width - VIEW_W));

        for (const b of this.bullets) {
            b.update(this.level.width, this.level.platforms);
            for (const p of this.level.platforms) {
                if (checkAABB(b, p) && b.type !== 'FIRE') { b.markedForDeletion = true; break; }
            }
            for (const e of this.level.enemies) {
                if (!b.markedForDeletion && checkAABB(b, e)) {
                    e.takeDamage(b.damage);
                    if (!b.penetrate) b.markedForDeletion = true;
                    break;
                }
            }
        }
        this.bullets = this.bullets.filter(b => !b.markedForDeletion);

        for (const e of this.level.enemies) {
            e.update(this.level.platforms);
            if (checkAABB(this.player, e)) {
                const dir = (this.player.x + this.player.width / 2 < e.x + e.width / 2) ? -1 : 1;
                this.player.takeDamage(4, dir);
            }
            if (e.isBoss && e.hp <= 0 && !this.stageClearAnim) {
                if (this.level.reward) {
                    this.player.unlockWeapon(this.level.reward);
                    this.newWeaponUnlocked = WEAPON_TYPES[this.level.reward].name;
                    speak(`擊敗頭目！獲得新絕招：${this.newWeaponUnlocked}`);
                }
                this.triggerStageClear();
            }
        }
        this.level.enemies = this.level.enemies.filter(e => !e.markedForDeletion);
    }

    triggerStageClear() {
        this.stageClearAnim = 100;
        if (!this.newWeaponUnlocked) speak("過關啦！");
    }

    drawHUD() {
        const ctx = this.ctx;
        ctx.save();
        const wp = WEAPON_TYPES[this.player.currentWeapon];
        ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
        const line = (text, y, color, size) => {                 // 字放大＋黑色描邊，老花眼也看得清楚
            ctx.font = `bold ${size}px ${FONT}`;
            ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,0.65)';
            ctx.strokeText(text, 62, y);
            ctx.fillStyle = color; ctx.fillText(text, 62, y);
        };
        line(`STAGE ${this.currentStage}/${this.maxStage}`, 34, '#FFF', 24);
        line(this.level.name, 62, '#FFE66D', 22);
        line(`${wp.icon} ${wp.name.split(' ')[0]}`, 90, wp.dress, 22);

        const barX = 25, barY = 20, uw = 20, uh = 4, sp = 1.5;
        ctx.fillStyle = '#000';
        ctx.fillRect(barX - 3, barY - 3, uw + 6, (uh + sp) * this.player.maxHp + 6);
        for (let i = 0; i < this.player.maxHp; i++) {
            const cy = barY + (this.player.maxHp - 1 - i) * (uh + sp);
            ctx.fillStyle = i < this.player.hp ? (this.player.hp <= 6 ? '#FF4757' : wp.dress) : '#333';
            ctx.fillRect(barX, cy, uw, uh);
        }
        ctx.restore();
    }

    drawGoalGate() {
        const g = this.level.goal;
        const rx = g.x - this.cameraX;
        this.ctx.save();
        this.ctx.shadowColor = '#FF5E97'; this.ctx.shadowBlur = 15;
        this.ctx.fillStyle = 'rgba(255, 94, 151, 0.4)';
        this.ctx.fillRect(rx, g.y, g.width, g.height);
        this.ctx.strokeStyle = '#FF5E97'; this.ctx.lineWidth = 3;
        this.ctx.strokeRect(rx, g.y, g.width, g.height);
        this.ctx.fillStyle = '#FFF'; this.ctx.font = 'bold 22px sans-serif';
        this.ctx.textAlign = 'center';
        this.ctx.fillText('💖', rx + g.width / 2, g.y + g.height / 2 + 8);
        this.ctx.restore();
    }

    draw() {
        const ctx = this.ctx, theme = this.level.theme;
        ctx.setTransform(this.scale, 0, 0, this.scale, 0, 0);
        ctx.fillStyle = theme.bg;
        ctx.fillRect(0, 0, VIEW_W, H);

        ctx.save();
        ctx.translate(0, -this.worldShift);
        for (const p of this.level.platforms) {
            const rx = p.x - this.cameraX;
            if (rx + p.width < 0 || rx > VIEW_W) continue;
            const ph = p.y >= 380 ? p.height + this.worldShift : p.height;   // 地面往下補滿，不會露出空白
            ctx.fillStyle = theme.plat;
            ctx.fillRect(rx, p.y, p.width, ph);
            ctx.strokeStyle = theme.border; ctx.lineWidth = 2;
            ctx.strokeRect(rx, p.y, p.width, ph);
        }

        this.drawGoalGate();
        for (const e of this.level.enemies) e.draw(ctx, this.cameraX);
        for (const b of this.bullets) b.draw(ctx, this.cameraX);
        this.player.draw(ctx, this.cameraX);
        ctx.restore();
        this.drawHUD();

        if (this.stageClearAnim > 0) {
            ctx.save();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, VIEW_W, H);
            ctx.textAlign = 'center';
            const maxW = VIEW_W - 30;
            if (this.newWeaponUnlocked) {
                fitText(ctx, '🎉 YOU GOT A NEW WEAPON! 🎉', VIEW_W / 2, H / 2 - 20, maxW, 36, '#FFD166');
                fitText(ctx, `【${this.newWeaponUnlocked}】`, VIEW_W / 2, H / 2 + 28, maxW, 26, '#00F2FE');
            } else {
                fitText(ctx, '✨ STAGE CLEAR! ✨', VIEW_W / 2, H / 2 - 10, maxW, 36, '#FFE66D');
            }
            ctx.restore();
        }

        if (this.allCleared) {
            ctx.save();
            ctx.fillStyle = 'rgba(15, 10, 25, 0.9)';
            ctx.fillRect(0, 0, VIEW_W, H);
            ctx.textAlign = 'center';
            const maxW = VIEW_W - 30;
            fitText(ctx, '🏆 全部十關大通關！ 🏆', VIEW_W / 2, H / 2 - 25, maxW, 42, '#FF5E97');
            fitText(ctx, '「爸爸太帥了！最愛爸爸！」💖', VIEW_W / 2, H / 2 + 28, maxW, 28, '#FFE66D');
            ctx.restore();
        }
    }

    // 固定 60 步／秒：畫面更新率不同（60/90/120/144Hz）遊戲速度都一樣
    loop(ts) {
        requestAnimationFrame(this.loop);
        if (this.lastTs === undefined) this.lastTs = ts;
        const dt = Math.min(ts - this.lastTs, 100);
        this.lastTs = ts;
        this.acc += dt;
        let n = 0;
        while (this.acc >= STEP_MS - 1 && n < 5) { this.update(); this.acc -= STEP_MS; n++; }
        if (n === 5) this.acc = 0;
        this.draw();
    }
}

window.onload = () => {
    window.game = new Game();
};
</script>
